<?xml version="1.0" encoding="utf-8"?>
<!-- Pluto-like grey planet with subtle craters and texture (lightweight SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="plutoGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e6e6e8"/>
      <stop offset="50%" stop-color="#bdbdc1"/>
      <stop offset="100%" stop-color="#7a7a7f"/>
    </radialGradient>

    <radialGradient id="specular" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="craterGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4d4d52"/>
      <stop offset="60%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#1b1b1d"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- main planet body with subtle outer glow -->
  <g filter="url(#softGlow)">
    <circle cx="220" cy="220" r="180" fill="url(#plutoGrad)" />
  </g>

  <!-- specular highlight -->
  <circle cx="220" cy="160" r="90" fill="url(#specular)" opacity="0.95" />

  <!-- crater shapes (darker depressions) -->
  <!-- craters removed per user request -->

  <!-- subtle surface speckles for texture -->
  <g fill="#9f9fa3" opacity="0.06">
    <circle cx="130" cy="140" r="1.6" />
    <circle cx="150" cy="170" r="1.1" />
    <circle cx="170" cy="120" r="1.0" />
    <circle cx="200" cy="200" r="1.3" />
    <circle cx="240" cy="160" r="1.0" />
    <circle cx="280" cy="210" r="1.4" />
    <circle cx="320" cy="140" r="1.0" />
    <circle cx="360" cy="180" r="0.9" />
    <circle cx="100" cy="200" r="1.2" />
    <circle cx="60" cy="160" r="1.0" />
    <circle cx="210" cy="250" r="1.1" />
    <circle cx="260" cy="110" r="0.9" />
    <circle cx="180" cy="90" r="1.0" />
    <circle cx="300" cy="240" r="0.8" />
  </g>

  <!-- nebula ovals removed per user request -->
</svg>
